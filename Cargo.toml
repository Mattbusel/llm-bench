[workspace]

[package]
name = "llm-bench"
version = "0.2.1"
edition = "2021"
description = "Send the same prompts to OpenAI, Anthropic or any OpenAI-compatible server and compare p50/p99 latency, tokens per second and cost in one table"
license = "MIT"
repository = "https://github.com/Mattbusel/llm-bench"
homepage = "https://github.com/Mattbusel/llm-bench"
readme = "README.md"
documentation = "https://github.com/Mattbusel/llm-bench#readme"
exclude = ["assets/", "packaging/", "scripts/", ".github/", "install.sh", "install.ps1"]
keywords = ["llm", "benchmark", "latency", "openai", "anthropic"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "llm-bench"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
# tokio: async runtime  -  core dependency for concurrent benchmark runs
tokio = { version = "1.40", features = ["full"] }

# reqwest: HTTP client for OpenAI and Anthropic API calls
reqwest = { version = "0.12", features = ["json"] }

# serde / serde_json: serialization for API request/response and JSON output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# thiserror: zero-cost typed error derive  -  replaces manual Display impls
thiserror = "1.0"

# clap: command-line argument parsing with derive macro
clap = { version = "4.5", features = ["derive", "env"] }

# indicatif: progress bars during benchmark runs
indicatif = "0.17"

# tabled: formatted ASCII tables for benchmark output
tabled = "0.15"

# colored: terminal color support for output
colored = "2.1"

# tracing / tracing-subscriber: structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# futures: async combinators for concurrent provider execution
futures = "0.3"

# tokio-stream: stream utilities for streaming API responses
tokio-stream = "0.1"

[dev-dependencies]
# wiremock: HTTP mock server for provider API testing
wiremock = "0.6"

# tokio test macro already provided by tokio/full
