[workspace]

[package]
name = "llm-bench"
version = "0.4.1"
edition = "2021"
description = "Compare LLM providers on your own prompts: OpenAI, Anthropic, OpenRouter, Groq, Together, Fireworks, DeepSeek, Gemini, Ollama or any OpenAI-compatible URL; time to first token, p50/p95 latency, tokens per second, error rate and cost, as a table, Markdown or JSON"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Mattbusel/llm-bench"
homepage = "https://github.com/Mattbusel/llm-bench"
readme = "README.md"
documentation = "https://docs.rs/llm-bench"
include = ["src/**/*", "tests/**/*", "examples/**/*", "scripts/mock_server.py", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
keywords = ["llm", "benchmark", "latency", "openai", "anthropic"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# cargo binstall: prebuilt binaries from GitLab releases (Linux x86_64 and
# Windows x86_64); other targets build from source.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/llm-bench-linux-x86_64.tar.gz"
bin-dir = "llm-bench-v{ version }-x86_64-unknown-linux-gnu/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/-/releases/v{ version }/downloads/llm-bench-windows-x86_64.exe"
pkg-fmt = "bin"

[[bin]]
name = "llm-bench"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "local_server"

[[example]]
name = "latency_gate"

[[example]]
name = "compare_providers"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = ["cli"]
# The llm-bench binary: argument parsing, progress bar, coloured table, logging.
cli = ["dep:clap", "dep:indicatif", "dep:tabled", "dep:colored", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/signal", "tokio/macros"]

[dependencies]
tokio = { version = "1.40", features = ["rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
futures = "0.3"
# Server-sent events parser for --stream.
eventsource-stream = "0.2"
# Retries with exponential backoff and jitter (--retries).
backon = { version = "1.5", default-features = false, features = ["std", "tokio-sleep"] }
# The HTTP-date form of Retry-After.
httpdate = "1"
# --output csv
csv = "1"
# Dated, source-cited list prices for cost per request.
llm-prices = "1.1.1"
# --config: custom OpenAI-compatible providers and prices.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# cli
clap = { version = "4.5", features = ["derive", "env"], optional = true }
indicatif = { version = "0.17", optional = true }
tabled = { version = "0.15", optional = true }
colored = { version = "2.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
# HTTP mock server for provider tests.
wiremock = "0.6"
# Property tests for the statistics.
proptest = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
