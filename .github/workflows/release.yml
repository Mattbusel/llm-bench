name: Release

# Push a tag like v1.2.0 to build llm-bench for Linux (glibc and static
# musl), macOS and Windows and attach the archives, SHA256SUMS.txt and a
# build provenance attestation to a GitHub Release.
#
# Archive layout: llm-bench-v<version>-<target>.tar.gz (or .zip on Windows)
# holding llm-bench-v<version>-<target>/llm-bench[.exe], README.md, LICENSE.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BIN: llm-bench
  NAME: llm-bench

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target="${{ matrix.target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${BIN} --version
          ./target/${{ matrix.target }}/release/${BIN} --help > /dev/null

      - name: Check the musl binary is static
        if: matrix.musl
        run: |
          file target/${{ matrix.target }}/release/${BIN}
          if ldd target/${{ matrix.target }}/release/${BIN} 2>&1 | grep -q '=>'; then
            echo "musl build links shared libraries" >&2
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${NAME}-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${BIN}" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "$env:NAME-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.NAME }}-*.tar.gz*
            ${{ env.NAME }}-*.zip*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 | sed 's/\r$//' | sort -k2 > SHA256SUMS.txt
          rm -f *.sha256
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          cat > notes.md <<NOTES
          Prebuilt binaries for ${NAME} ${TAG}.

          | System | File |
          |--------|------|
          | Windows x86_64 | \`${NAME}-${TAG}-x86_64-pc-windows-msvc.zip\` |
          | macOS Apple Silicon | \`${NAME}-${TAG}-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`${NAME}-${TAG}-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 (static, any distro) | \`${NAME}-${TAG}-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux arm64 (static, any distro) | \`${NAME}-${TAG}-aarch64-unknown-linux-musl.tar.gz\` |
          | Linux x86_64 (glibc 2.35+) | \`${NAME}-${TAG}-x86_64-unknown-linux-gnu.tar.gz\` |

          Unpack and run \`${BIN} --help\`. Verify downloads with SHA256SUMS.txt or \`gh attestation verify <file> --repo ${GH_REPO}\`. The binaries are unsigned: Windows SmartScreen may show "unknown publisher" (More info, then Run anyway); on macOS right-click the file and choose Open. See CHANGELOG.md for what changed.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "${NAME} ${TAG}" --notes-file notes.md
          fi
